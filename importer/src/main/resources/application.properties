quarkus.application.name=hzd-importer
quarkus.http.port=${QUARKUS_HTTP_PORT:8081}

# Database (H2 für lokale Entwicklung)
quarkus.datasource.db-kind=h2
quarkus.datasource.username=importer
quarkus.datasource.password=importer
quarkus.datasource.jdbc.url=jdbc:h2:mem:importer;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.log.sql=false

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1
quarkus.flyway.baseline-description=Initial import_jobs schema

# CSV input
importer.csv.members-path=${IMPORTER_CSV_MEMBERS_PATH:members.csv}
importer.csv.dogs-path=${IMPORTER_CSV_DOGS_PATH:dogs.csv}
importer.csv.upload-directory=${IMPORTER_CSV_UPLOAD_DIRECTORY:}
quarkus.http.limits.max-body-size=${QUARKUS_HTTP_LIMITS_MAX_BODY_SIZE:50M}

# Scheduler (dev: aus, prod: siehe application-prod.properties)
importer.scheduler.enabled=${IMPORTER_SCHEDULER_ENABLED:false}
importer.scheduler.cron=${IMPORTER_SCHEDULER_CRON:0 0 2 * * ?}

# Strapi REST API
importer.strapi.base-url=${IMPORTER_STRAPI_BASE_URL:http://127.0.0.1:1337/api}
importer.strapi.api-token=${IMPORTER_STRAPI_API_TOKEN:}
importer.strapi.http-timeout=${IMPORTER_STRAPI_HTTP_TIMEOUT:30s}
importer.strapi.page-size=${IMPORTER_STRAPI_PAGE_SIZE:100}
importer.strapi.max-retries=${IMPORTER_STRAPI_MAX_RETRIES:3}
importer.strapi.request-delay=${IMPORTER_STRAPI_REQUEST_DELAY:100ms}

# Job-Log-Dateien: import-<timestamp>.log
importer.log.directory=${IMPORTER_LOG_DIRECTORY:logs}
importer.log.retention-days=${IMPORTER_LOG_RETENTION_DAYS:7}

# Import-Bericht per SMTP
importer.mail.enabled=${IMPORTER_MAIL_ENABLED:false}
importer.mail.from=${IMPORTER_MAIL_FROM:}
importer.mail.to=${IMPORTER_MAIL_TO:}
importer.mail.subject-prefix=${IMPORTER_MAIL_SUBJECT_PREFIX:[HZD Import]}

# SMTP (Quarkus Mailer)
# Username/Passwort nicht setzen: dann kein SMTP-Login (Testbetrieb ohne Auth).
# QUARKUS_MAILER_USERNAME / QUARKUS_MAILER_PASSWORD werden automatisch gemappt.
quarkus.mailer.from=${QUARKUS_MAILER_FROM:${IMPORTER_MAIL_FROM:}}
quarkus.mailer.host=${QUARKUS_MAILER_HOST:localhost}
quarkus.mailer.port=${QUARKUS_MAILER_PORT:25}
quarkus.mailer.tls=${QUARKUS_MAILER_TLS:false}
quarkus.mailer.start-tls=${QUARKUS_MAILER_START_TLS:DISABLED}
quarkus.mailer.login=${QUARKUS_MAILER_LOGIN:NONE}
%dev.quarkus.mailer.mock=true
%test.quarkus.mailer.mock=true

# Retry
importer.retry.initial-delay=${IMPORTER_RETRY_INITIAL_DELAY:1s}
importer.retry.max-delay=${IMPORTER_RETRY_MAX_DELAY:30s}

# REST client
quarkus.rest-client.strapi-api.url=${IMPORTER_STRAPI_BASE_URL:http://127.0.0.1:1337/api}

# Dev-Profil: Scheduler explizit deaktiviert
%dev.importer.scheduler.enabled=false
