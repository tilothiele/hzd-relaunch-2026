services:
  joomla:
    image: php:5.6-apache
    container_name: joomla3
    restart: unless-stopped
    networks:
      - coolify
    volumes:
      - "/srv/docker-volumes/joomla-website:/var/www/html"

    environment:
      JOOMLA_DB_HOST: $MYSQL_HOST
      JOOMLA_DB_NAME: $MYSQL_DATABASE
      JOOMLA_DB_USER: $MYSQL_USER
      JOOMLA_DB_PASSWORD: $MYSQL_PASSWORD

networks:
  coolify:
    external: true

